serenity {
  project.name = "EriBank - Screenplay"
  take.screenshots = FOR_EACH_ACTION
  logging = VERBOSE
}

webdriver {
  driver = appium
  timeouts {
    implicitlywait = 5000
  }
}

# Appium 2/3 usa el protocolo W3C: las capacidades propias de Appium deben llevar el prefijo "appium:".
# Con estas dos propiedades Serenity agrega el prefijo a las capacidades listadas.
appium.process.desired.capabilities = true
appium.additional.capabilities = "automationName,deviceName,appPackage,appActivity,noReset,fullReset,newCommandTimeout"

appium {
  hub = "http://127.0.0.1:4723"
  platformName = "Android"
  automationName = "UiAutomator2"
  deviceName = "emulator-5554"
  # La app se instala antes con: adb install -r --bypass-low-target-sdk-block src/test/resources/app/EriBank.apk
  # (EriBank tiene targetSdk 10 y Android 14+ bloquea instalarla de forma normal, incluso desde Appium)
  appPackage = "com.experitest.ExperiBank"
  appActivity = ".LoginActivity"
  noReset = false
  fullReset = false
  newCommandTimeout = 120
}

serenity.restart.browser.for.each = scenario

eribank {
  username = "company"
  password = "company"
}
